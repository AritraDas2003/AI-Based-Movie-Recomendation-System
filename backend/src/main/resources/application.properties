# Application Configurations
spring.application.name=movierec
server.port=${PORT:8080}

# Database Configurations (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/movierec
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging Settings
logging.level.org.springframework.security=INFO
logging.level.com.project.movierec=DEBUG

# TMDB External API Configurations
tmdb.api.url=https://api.themoviedb.org/3
# Put your TMDB Read Access Token (v4) here
tmdb.api.token=${TMDB_API_TOKEN:}

# AI Microservice Configuration
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

# Security JWT Configurations (Secret must be HS256 compatible - at least 256 bits hex encoded)
security.jwt.secret-key=${JWT_SECRET:CineMatch_2026_Local_JWT_Secret_8xP4mQ7zL2}
# Expiry set to 1 day (in milliseconds)
security.jwt.expiration-time=86400000
