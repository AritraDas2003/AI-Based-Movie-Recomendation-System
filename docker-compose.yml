version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: movierec-db
    environment:
      POSTGRES_DB: movierec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movierec-net

  ai-service:
    build: ./ai-service
    container_name: movierec-ai
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - movierec-net

  backend:
    build: ./backend
    container_name: movierec-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
      - ai-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/movierec
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - TMDB_API_TOKEN=${TMDB_API_TOKEN}
      - AI_SERVICE_URL=http://ai-service:8000
    networks:
      - movierec-net

  frontend:
    build: ./frontend
    container_name: movierec-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - movierec-net

volumes:
  postgres_data:

networks:
  movierec-net:
    driver: bridge
